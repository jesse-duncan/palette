[package]
name = "palette"
version = "1.0.0"
description = "Lightweight Cross-Platform Desktop Overlay Utility"
authors = ["you"]
edition = "2021"

[lib]
name = "palette_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
