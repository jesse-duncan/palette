name: "Build and Release Palette"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Placeholder Icons
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = path.join('src-tauri', 'icons');
          if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
          const png = Buffer.from('iVBORw0KGgoAAAANSU56AAAAAElFTkSuQmCC', 'base64');
          ['32x32.png', '128x128.png', '128x128@2x.png', 'icon.icns', 'icon.ico'].forEach(f => {
            fs.writeFileSync(path.join(dir, f), png);
          });
          "

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0-${{ github.run_number }}
          releaseName: "Palette v1.0.0 (Build ${{ github.run_number }})"
          releaseBody: "Automated release of Palette overlay."
          releaseDraft: false
          prerelease: false
